name: MRT1 Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f mrt1/CMakeLists.txt
          test -f mrt1/android/AndroidManifest.xml
          echo "MRT1 source tree found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: linux
          target: android
          arch: android_armv7
          modules: 'qtshadertools qtmultimedia qtpositioning qtserialport'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;25.2.9519653'

      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_NDK_ROOT"

      - name: Verify Qt CMake package
        run: |
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Core/Qt6CoreConfig.cmake"
          echo "Qt6 Core package found"
          ls -la "$QT_ROOT_DIR/lib/cmake/Qt6Core"

      - name: Configure
        run: |
          chmod +x "$QT_ROOT_DIR/bin/qt-cmake"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR:$QT_ROOT_DIR/lib/cmake/Qt6:$QT_ROOT_DIR/lib/cmake/Qt6Core${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          export Qt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6"
          export Qt6Core_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Core"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          echo "Qt6_DIR=$Qt6_DIR"
          echo "Qt6Core_DIR=$Qt6Core_DIR"
          "$QT_ROOT_DIR/bin/qt-cmake" -S mrt1 -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DQt6Core_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Core" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake/Qt6;$QT_ROOT_DIR/lib/cmake/Qt6Core" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Find APK
        run: |
          find build -type f -name "*.apk" -print
          test -n "$(find build -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
