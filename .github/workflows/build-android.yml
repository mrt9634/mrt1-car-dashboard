name: MRT1 Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f mrt1/CMakeLists.txt
          test -f mrt1/android/AndroidManifest.xml
          echo "MRT1 source tree found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.2.0"

      - name: Install Qt 6.5.3
        run: |
          set -e
          mkdir -p "$HOME/Qt"
          python -m aqt install-qt linux android 6.5.3 android_x86_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport
          python -m aqt install-qt linux desktop 6.5.3 gcc_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport

      - name: Set Qt env
        run: |
          echo "QT_ROOT_DIR=$HOME/Qt/6.5.3/android_x86_64" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/6.5.3/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.5.3/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.5.3/android_x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Qt
        run: |
          set -e
          ls -la "$HOME/Qt/6.5.3/"
          test -f "$HOME/Qt/6.5.3/android_x86_64/lib/cmake/Qt6/Qt6Config.cmake"
          echo "Qt OK"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Verify Android SDK
        run: |
          set -e
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          test -d "$ANDROID_NDK_ROOT"

      - name: Configure
        run: |
          set -e
          QT_ROOT_DIR="$HOME/Qt/6.5.3/android_x86_64"
          QT_HOST_PATH="$HOME/Qt/6.5.3/gcc_64"
          chmod +x "$QT_ROOT_DIR/bin/qt-cmake"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qt-cmake" -S mrt1 -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_ANDROID_ABIS=x86_64 \
            -DANDROID_ABI=x86_64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_PLATFORM=android-23

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Debug info
        run: |
          echo "════════ .so files ════════"
          find build -name "*.so" -type f 2>/dev/null || echo "NONE"
          echo ""
          echo "════════ deployment-settings.json ════════"
          cat build/android-MRT1-deployment-settings.json 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "════════ android-build/libs ════════"
          ls -laR build/android-build/libs/ 2>/dev/null || echo "NOT FOUND"

      - name: Fix ABI in deployment settings
        run: |
          set -e
          SETTINGS="build/android-MRT1-deployment-settings.json"
          if [ -f "$SETTINGS" ]; then
            echo "Settings file found, patching ABI..."
            python3 -c "import json; f='$SETTINGS'; d=json.load(open(f)); d['android']['abi']='x86_64'; json.dump(d, open(f,'w'), indent=2); print('Patched ABI to x86_64')"
            echo "===== After patch ====="
            cat "$SETTINGS" | head -40
          else
            echo "Settings file not found!"
          fi

      - name: Force-copy .so files
        run: |
          set -e
          QT_LIBS="$HOME/Qt/6.5.3/android_x86_64/lib"
          TARGET="build/android-build/libs/x86_64"
          
          echo "Creating target dir: $TARGET"
          mkdir -p "$TARGET"
          
          echo "Looking for libMRT1*.so..."
          MAIN_SO=$(find build -name "libMRT1*.so" -type f | head -1)
          if [ -n "$MAIN_SO" ]; then
            echo "Found: $MAIN_SO"
            cp -v "$MAIN_SO" "$TARGET/"
          else
            echo "ERROR: libMRT1*.so not found!"
            exit 1
          fi
          
          echo "Copying Qt libs..."
          find "$QT_LIBS" -maxdepth 1 -name "libQt6*.so" -exec cp -v {} "$TARGET/" \; 2>/dev/null || true
          
          echo "Copying libc++_shared.so..."
          find "$QT_LIBS" -name "libc++_shared.so" -exec cp -v {} "$TARGET/" \; 2>/dev/null || true
          
          echo "===== Final content of target ====="
          ls -la "$TARGET/"
          
          echo "===== Total size ====="
          du -sh "$TARGET/"

      - name: Rebuild APK with copied libs
        run: |
          set -e
          cd build/android-build
          
          echo "===== APK build.gradle exists? ====="
          ls -la build.gradle 2>/dev/null || echo "no build.gradle"
          
          echo "===== Running gradle assembleRelease ====="
          chmod +x gradlew 2>/dev/null || true
          
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon 2>&1 | tail -30 || echo "gradle failed"
          else
            echo "gradlew not found, trying gradle directly"
            gradle assembleRelease --no-daemon 2>&1 | tail -30 || echo "gradle failed"
          fi

      - name: Debug final APK
        run: |
          echo "════════ All APKs found ════════"
          find build -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "════════ Contents of each APK ════════"
          for apk in $(find build -name "*.apk" -type f); do
            echo "===== $apk ====="
            unzip -l "$apk" 2>/dev/null | head -30
          done

      - name: Sign APK
        run: |
          set -e
          APK_SIGNER="$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
          KEYSTORE="$RUNNER_TEMP/mrt1.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"
          COUNT=0
          while IFS= read -r apk; do
            echo "Signing $apk"
            "$APK_SIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android "$apk"
            COUNT=$((COUNT + 1))
          done < <(find build -type f -name "*.apk" -print)
          test "$COUNT" -gt 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
