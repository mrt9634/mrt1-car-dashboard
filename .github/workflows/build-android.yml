name: MRT1 Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:name: MRT1 Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f mrt1/CMakeLists.txt
          test -f mrt1/android/AndroidManifest.xml
          echo "MRT1 source tree found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.2.0"

      - name: Install Qt 6.5.3 ARM
        run: |
          set -e
          mkdir -p "$HOME/Qt"
          python -m aqt install-qt linux android 6.5.3 android_armv7 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport
          python -m aqt install-qt linux desktop 6.5.3 gcc_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport

      - name: Set Qt env
        run: |
          echo "QT_ROOT_DIR=$HOME/Qt/6.5.3/android_armv7" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/6.5.3/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.5.3/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.5.3/android_armv7/bin" >> "$GITHUB_PATH"

      - name: Verify Qt
        run: |
          set -e
          ls -la "$HOME/Qt/6.5.3/"
          test -f "$HOME/Qt/6.5.3/android_armv7/lib/cmake/Qt6/Qt6Config.cmake"
          echo "Qt ARM OK"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Verify Android SDK
        run: |
          set -e
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          test -d "$ANDROID_NDK_ROOT"

      - name: Configure
        run: |
          set -e
          QT_ROOT_DIR="$HOME/Qt/6.5.3/android_armv7"
          QT_HOST_PATH="$HOME/Qt/6.5.3/gcc_64"
          chmod +x "$QT_ROOT_DIR/bin/qt-cmake"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qt-cmake" -S mrt1 -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_ANDROID_ABIS=armeabi-v7a \
            -DANDROID_ABI=armeabi-v7a \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_PLATFORM=android-23

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Find APK
        run: |
          echo "════════ All APKs found ════════"
          find build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Sign APK
        run: |
          set -e
          APK_SIGNER="$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
          KEYSTORE="$RUNNER_TEMP/mrt1.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"
          COUNT=0
          while IFS= read -r apk; do
            echo "Signing $apk"
            "$APK_SIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android "$apk"
            COUNT=$((COUNT + 1))
          done < <(find build -type f -name "*.apk" -print)
          test "$COUNT" -gt 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f mrt1/CMakeLists.txt
          test -f mrt1/android/AndroidManifest.xml
          echo "MRT1 source tree found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.2.0"

      - name: Install Qt 6.5.3
        run: |
          set -e
          mkdir -p "$HOME/Qt"
          python -m aqt install-qt linux android 6.5.3 android_x86_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport
          python -m aqt install-qt linux desktop 6.5.3 gcc_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport

      - name: Set Qt env
        run: |
          echo "QT_ROOT_DIR=$HOME/Qt/6.5.3/android_x86_64" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/6.5.3/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.5.3/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.5.3/android_x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Qt
        run: |
          set -e
          ls -la "$HOME/Qt/6.5.3/"
          test -f "$HOME/Qt/6.5.3/android_x86_64/lib/cmake/Qt6/Qt6Config.cmake"
          echo "Qt OK"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Verify Android SDK
        run: |
          set -e
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          test -d "$ANDROID_NDK_ROOT"

      - name: Configure
        run: |
          set -e
          QT_ROOT_DIR="$HOME/Qt/6.5.3/android_x86_64"
          QT_HOST_PATH="$HOME/Qt/6.5.3/gcc_64"
          chmod +x "$QT_ROOT_DIR/bin/qt-cmake"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qt-cmake" -S mrt1 -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_ANDROID_ABIS=x86_64 \
            -DANDROID_ABI=x86_64 \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_PLATFORM=android-23

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # ═══════════════════════════════════════════════════════
      # DEBUG: Explore the deployment-settings.json structure
      # ═══════════════════════════════════════════════════════
      - name: Debug deployment settings structure
        run: |
          echo "════════ File exists? ════════"
          ls -la build/android-MRT1-deployment-settings.json || echo "NOT FOUND"
          echo ""
          echo "════════ First 60 lines ════════"
          head -60 build/android-MRT1-deployment-settings.json 2>/dev/null || echo "empty"
          echo ""
          echo "════════ All top-level keys ════════"
          python3 -c "
import json
try:
    d = json.load(open('build/android-MRT1-deployment-settings.json'))
    print('TOP KEYS:', list(d.keys()))
    if 'android' in d:
        print('ANDROID KEYS:', list(d['android'].keys()))
    else:
        print('NO android key!')
except Exception as e:
    print('Error reading:', e)
"

      - name: Fix ABI in deployment settings (safe)
        run: |
          set -e
          SETTINGS="build/android-MRT1-deployment-settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "Settings file not found!"
            exit 0
          fi
          echo "Settings found, patching..."
          python3 -c "
import json
f = '$SETTINGS'
d = json.load(open(f))
if 'android' not in d:
    d['android'] = {}
d['android']['abi'] = 'x86_64'
# Also try to ensure libs directory mapping
if 'android-package-source-directory' not in d:
    d['android-package-source-directory'] = 'android'
json.dump(d, open(f, 'w'), indent=2)
print('Patched. New keys:', list(d.keys()))
"
          echo "===== After patch ====="
          cat "$SETTINGS" | head -50

      - name: Locate all .so files
        run: |
          echo "════════ All .so files ════════"
          find build -name "*.so" -type f -exec ls -lh {} \;
          echo ""
          echo "════════ build structure (top 2 levels) ════════"
          find build -maxdepth 2 -type d | head -30

      - name: Force-copy .so files
        run: |
          set -e
          QT_LIBS="$HOME/Qt/6.5.3/android_x86_64/lib"
          TARGET="build/android-build/libs/x86_64"
          
          echo "Target: $TARGET"
          mkdir -p "$TARGET"
          
          echo "Looking for libMRT1*.so..."
          MAIN_SO=$(find build -name "libMRT1*.so" -type f | head -1)
          if [ -z "$MAIN_SO" ]; then
            echo "ERROR: libMRT1*.so not found!"
            find build -name "*.so" -type f || echo "no .so at all"
            exit 1
          fi
          echo "Found: $MAIN_SO"
          cp -v "$MAIN_SO" "$TARGET/"
          
          echo "Copying Qt libs..."
          find "$QT_LIBS" -maxdepth 1 -name "libQt6*.so" -exec cp -v {} "$TARGET/" \; 2>/dev/null || true
          
          echo "Copying libc++_shared.so..."
          find "$HOME/Qt/6.5.3/android_x86_64" -name "libc++_shared.so" -exec cp -v {} "$TARGET/" \; 2>/dev/null || true
          
          echo ""
          echo "===== Final .so list ====="
          ls -la "$TARGET/"
          echo ""
          echo "===== Total size ====="
          du -sh "$TARGET/"

      - name: Rebuild APK manually with androiddeployqt
        run: |
          set -e
          QT_ROOT_DIR="$HOME/Qt/6.5.3/android_x86_64"
          QT_HOST_PATH="$HOME/Qt/6.5.3/gcc_64"
          
          # Find androiddeployqt
          ANDROIDDEPLOYQT="$QT_HOST_PATH/bin/androiddeployqt"
          if [ ! -x "$ANDROIDDEPLOYQT" ]; then
            ANDROIDDEPLOYQT="$QT_ROOT_DIR/bin/androiddeployqt"
          fi
          
          if [ ! -x "$ANDROIDDEPLOYQT" ]; then
            echo "ERROR: androiddeployqt not found"
            find "$HOME/Qt" -name "androiddeployqt" -type f
            exit 1
          fi
          
          echo "Using: $ANDROIDDEPLOYQT"
          
          # Clean previous build
          rm -rf build/android-build
          mkdir -p build/android-build
          
          echo "===== Running androiddeployqt ====="
          "$ANDROIDDEPLOYQT" \
            --input build/android-MRT1-deployment-settings.json \
            --output build/android-build \
            --android-platform android-33 \
            --gradle \
            --release 2>&1 | tail -50 || echo "androiddeployqt finished with errors"
          
          echo "===== Output ====="
          ls -la build/android-build/ | head -20

      - name: Debug final APK
        run: |
          echo "════════ All APKs ════════"
          find build -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "════════ APK contents ════════"
          for apk in $(find build -name "*.apk" -type f); do
            echo "===== $apk ====="
            unzip -l "$apk" 2>/dev/null | grep -E "\.so|lib/" | head -30 || echo "no .so in APK"
          done

      - name: Sign APK
        run: |
          set -e
          APK_SIGNER="$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
          KEYSTORE="$RUNNER_TEMP/mrt1.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"
          COUNT=0
          while IFS= read -r apk; do
            echo "Signing $apk"
            "$APK_SIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android "$apk"
            COUNT=$((COUNT + 1))
          done < <(find build -type f -name "*.apk" -print)
          test "$COUNT" -gt 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
