name: MRT1 Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f mrt1/CMakeLists.txt
          test -f mrt1/android/AndroidManifest.xml
          echo "MRT1 source tree found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.2.0"

      - name: Install Qt 6.5.3
        run: |
          set -e
          mkdir -p "$HOME/Qt"
          python -m aqt install-qt linux android 6.5.3 android_x86_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport
          python -m aqt install-qt linux desktop 6.5.3 gcc_64 \
            --outputdir "$HOME/Qt" \
            --modules qtshadertools qtmultimedia qtpositioning qtserialport

      - name: Set Qt env
        run: |
          echo "QT_ROOT_DIR=$HOME/Qt/6.5.3/android_x86_64" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/6.5.3/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.5.3/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.5.3/android_x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Qt
        run: |
          set -e
          ls -la "$HOME/Qt/6.5.3/"
          test -f "$HOME/Qt/6.5.3/android_x86_64/lib/cmake/Qt6/Qt6Config.cmake"
          echo "Qt OK"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Verify Android SDK
        run: |
          set -e
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          test -d "$ANDROID_NDK_ROOT"

      - name: Configure
        run: |
          set -e
          QT_ROOT_DIR="$HOME/Qt/6.5.3/android_x86_64"
          QT_HOST_PATH="$HOME/Qt/6.5.3/gcc_64"
          chmod +x "$QT_ROOT_DIR/bin/qt-cmake"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/qt-cmake" -S mrt1 -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_ANDROID_ABIS=x86_64 \
            -DANDROID_ABI=x86_64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_PLATFORM=android-23

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # ═══════════════════════════════════════════════════════
      # FIX: Force-copy .so files into the location Qt expects
      # ═══════════════════════════════════════════════════════
      - name: Fix ABI deployment — force copy .so files
        run: |
          set -e
          echo "════════ Before fix: where are the .so files? ════════"
          find build -name "libMRT1*.so" -type f || echo "none found"
          echo "════════ android-build contents ════════"
          ls -laR build/android-build/ 2>/dev/null | head -40 || echo "no android-build dir"
          
          echo "════════ Checking deployment-settings.json ABI ════════"
          if [ -f build/android-MRT1-deployment-settings.json ]; then
            cat build/android-MRT1-deployment-settings.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('ABIs:', d.get('android',{}).get('abi', 'unknown'))" 2>/dev/null || echo "could not parse"
          fi
          
          echo "════════ FIX: Patches deployment-settings.json ════════"
          # Fix the ABI in deployment-settings.json if it's wrong
          if [ -f build/android-MRT1-deployment-settings.json ]; then
            python3 << 'PYEOF'
import json
import sys

path = 'build/android-MRT1-deployment-settings.json'
with open(path, 'r') as f:
    data = json.load(f)

if 'android' in data:
    # Force ABI to x86_64
    data['android']['abi'] = 'x86_64'
    print("Patched ABI to: x86_64")

    # Also patch buildABIs if exists
    if 'buildABIs' in data['android']:
        data['android']['buildABIs'] = ['x86_64']
        print("Patched buildABIs to: ['x86_64']")

with open(path, 'w') as f:
    json.dump(data, f, indent=2)

print("Deployment settings patched")
PYEOF
            cat build/android-MRT1-deployment-settings.json | head -30
          fi
          
          echo "════════ Re-run Qt deployment with patched settings ════════"
          # Find Qt's androiddeployqt
          ANDROIDDEPLOYQT="$HOME/Qt/6.5.3/gcc_64/bin/androiddeployqt"
          if [ ! -x "$ANDROIDDEPLOYQT" ]; then
            ANDROIDDEPLOYQT="$HOME/Qt/6.5.3/android_x86_64/bin/androiddeployqt"
          fi
          
          if [ -x "$ANDROIDDEPLOYQT" ]; then
            echo "Found androiddeployqt: $ANDROIDDEPLOYQT"
            # Clean previous android-build
            rm -rf build/android-build
            mkdir -p build/android-build
            
            # Re-deploy with correct ABI
            "$ANDROIDDEPLOYQT" \
              --input build/android-MRT1-deployment-settings.json \
              --output build/android-build \
              --android-platform android-33 \
              --gradle \
              --release 2>&1 | tail -30 || echo "androiddeployqt failed, continuing..."
          else
            echo "androiddeployqt not found, will try alternative approach"
          fi

      - name: Manual .so copy fallback
        run: |
          set -e
          echo "════════ Manual .so copy fallback ════════"
          
          # Find the .so file(s)
          LIBMRT1=$(find build -name "libMRT1_x86_64.so" -type f | head -1)
          echo "Found: $LIBMRT1"
          
          if [ -z "$LIBMRT1" ]; then
            echo "ERROR: libMRT1_x86_64.so not found!"
            find build -name "*.so" -type f || echo "no .so files at all"
            exit 1
          fi
          
          # Ensure target dir exists
          mkdir -p build/android-build/libs/x86_64
          
          # Copy main lib
          cp "$LIBMRT1" build/android-build/libs/x86_64/
          echo "Copied: $(ls -la build/android-build/libs/x86_64/)"
          
          # Copy Qt libs
          QT_LIBS="$HOME/Qt/6.5.3/android_x86_64/lib"
          echo "Qt libs dir: $QT_LIBS"
          ls -la "$QT_LIBS"/*.so 2>/dev/null | head -5 || echo "no Qt .so directly"
          
          # Copy needed Qt .so files
          find "$QT_LIBS" -maxdepth 1 -name "libQt6*.so" -exec cp {} build/android-build/libs/x86_64/ \; 2>/dev/null || true
          
          echo "════════ After copy ════════"
          ls -la build/android-build/libs/x86_64/ | head -30

      - name: Debug APK contents
        run: |
          echo "════════ Listing android-build/libs ════════"
          ls -laR build/android-build/libs/ 2>/dev/null || echo "no libs dir"
          echo ""
          echo "════════ All .so files in build ════════"
          find build -name "*.so" -type f 2>/dev/null | head -20
          echo ""
          echo "════════ APK contents ════════"
          find build -name "*.apk" -type f -exec unzip -l {} \; 2>/dev/null | head -30

      - name: Sign APK
        run: |
          set -e
          APK_SIGNER="$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
          KEYSTORE="$RUNNER_TEMP/mrt1.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"
          COUNT=0
          while IFS= read -r apk; do
            echo "Signing $apk"
            "$APK_SIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android "$apk"
            COUNT=$((COUNT + 1))
          done < <(find build -type f -name "*.apk" -print)
          test "$COUNT" -gt 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
