name: MRT1 Full Source Export

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source ZIP
        run: |
          git archive --format=zip --output=MRT1-car-dashboard-source.zip HEAD
          test -s MRT1-car-dashboard-source.zip
          unzip -t MRT1-car-dashboard-source.zip >/dev/null
          echo "Source ZIP created:"
          ls -lh MRT1-car-dashboard-source.zip

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-Full-Source
          path: MRT1-car-dashboard-source.zip
          if-no-files-found: error
